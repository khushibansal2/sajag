# Pin everything. A hackathon build that resolves a different transitive
# version in December than it did in October is a whole evening you do not have.
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
coreKtx = "1.15.0"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
room = "2.6.1"
work = "2.10.0"
camerax = "1.4.1"
arcore = "1.47.0"
# World-anchored AR in Compose. 2.2.1 is the last release built for our
# toolchain (Kotlin 1.9, AGP 8.4, compileSdk 34, ARCore 1.43): newer releases
# need Kotlin 2.2+ and a newer Compose. Do not bump it on its own.
sceneview = "2.2.1"
bouncycastle = "1.79"
zxingCore = "3.5.3"
zxingEmbedded = "4.3.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
orgJson = "20240303"

[libraries]
core-ktx            = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
lifecycle-runtime   = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
activity-compose    = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-bom         = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui          = { module = "androidx.compose.ui:ui" }
compose-graphics    = { module = "androidx.compose.ui:ui-graphics" }
compose-preview     = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3   = { module = "androidx.compose.material3:material3" }
compose-foundation  = { module = "androidx.compose.foundation:foundation" }
compose-animation   = { module = "androidx.compose.animation:animation" }
room-runtime        = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx            = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler       = { module = "androidx.room:room-compiler", version.ref = "room" }
work-runtime        = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
camera-core         = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2      = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle    = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view         = { module = "androidx.camera:camera-view", version.ref = "camerax" }
arcore              = { module = "com.google.ar:core", version.ref = "arcore" }
arsceneview         = { module = "io.github.sceneview:arsceneview", version.ref = "sceneview" }
# Android 10 (API 29) has NO platform Ed25519 — Conscrypt only exposes it on
# much newer releases. This dependency is not optional; dropping it compiles
# and then fails on exactly the cheap phones this product exists for.
bouncycastle        = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
# QR: core renders the certificate, embedded scans it — both fully offline.
zxing-core          = { module = "com.google.zxing:core", version.ref = "zxingCore" }
zxing-embedded      = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxingEmbedded" }
junit               = { module = "junit:junit", version.ref = "junit" }
androidx-junit      = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
# Real org.json for JVM unit tests (android.jar only ships stubs).
org-json            = { module = "org.json:json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp", version = "2.0.21-1.0.28" }
