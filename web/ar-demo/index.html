<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Sajag AR Drill</title>
<style>
  :root { --y:#FFC107; --r:#E53935; --g:#43A047; --ink:#ECEFF1; --panel:rgba(14,18,24,.88); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#000; color:var(--ink);
    font-family: "Segoe UI", "Noto Sans Devanagari", system-ui, sans-serif; }
  #cam, #gl { position:fixed; inset:0; width:100%; height:100%; }
  #cam { object-fit:cover; }
  #gl { touch-action:none; }
  .top { position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:12px;
    padding:10px 16px; background:linear-gradient(#000c,#0000); }
  .brand { font-weight:800; color:var(--y); font-size:20px; }
  .pill { background:#0009; border:1px solid #fff3; border-radius:99px; padding:5px 12px; font-size:13px; }
  .pill.live { border-color:var(--r); color:#ffb4b0; }
  .sp { flex:1; }
  button { font:inherit; cursor:pointer; border:0; border-radius:14px; padding:12px 16px;
    background:#263238; color:var(--ink); font-weight:700; font-size:16px; }
  button.pri { background:var(--y); color:#000; }
  button.bad { background:var(--r); color:#fff; }
  button:hover { filter:brightness(1.12); }
  .card { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); width:min(560px, calc(100% - 32px));
    background:var(--panel); border:1px solid #ffffff1f; border-radius:22px; padding:16px 18px; backdrop-filter:blur(8px); }
  .card h2 { margin:0 0 4px; color:var(--y); font-size:20px; }
  .card p { margin:0 0 12px; line-height:1.45; }
  .opts { display:grid; gap:8px; }
  .opts button { text-align:left; display:flex; gap:12px; align-items:center; }
  .opts .ic { display:inline-flex; }
  .opts .ic svg { width:28px; height:28px; fill:var(--y); }
  .ico { width:1.15em; height:1.15em; fill:currentColor; vertical-align:-0.2em; }
  .meter { height:10px; background:#263238; border-radius:9px; overflow:hidden; margin:6px 0 12px; }
  .meter i { display:block; height:100%; width:0; background:var(--g); transition:width .15s; }
  #stop { position:fixed; inset:0; background:#3b0000ee; display:none; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:24px; gap:14px; }
  #stop b { font-size:64px; letter-spacing:4px; }
  #hud { position:fixed; right:16px; top:64px; display:grid; gap:6px; text-align:right; font-size:13px; }
  #detector { position:fixed; left:16px; top:64px; background:#101010e6; border:2px solid #555; border-radius:14px;
    padding:10px 14px; font-family:Consolas, monospace; display:none; min-width:190px; }
  #detector .v { font-size:28px; font-weight:800; }
  #start { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(#1b1f26,#05070a); }
  #start .box { width:min(620px, calc(100% - 32px)); text-align:center; }
  #start h1 { color:var(--y); font-size:40px; margin:0; }
  .mods { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:22px; }
  .mods button { padding:22px 12px; font-size:18px; }
  .mods .big { display:block; }
  .mods .big svg { width:46px; height:46px; fill:var(--y); }
  .lang { margin-top:16px; display:flex; gap:8px; justify-content:center; }
  .lang button.on { outline:2px solid var(--y); }
  .res td { padding:3px 8px; } .res td:last-child { text-align:right; font-weight:800; }
  .hint { color:#90A4AE; font-size:13px; }
  @media (max-width:520px){ .mods{grid-template-columns:1fr;} #start h1{font-size:30px;} }
</style>
</head>

function tex(draw, w = 256, h = 256) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.needsUpdate = true; return t;
}
const glow = tex((g, w, h) => { const r = g.createRadialGradient(w/2, h/2, 0, w/2, h/2, w/2);
  r.addColorStop(0, '#fff'); r.addColorStop(.35, 'rgba(255,255,255,.55)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, h); });
function label(text, bg = '#FFC107', fg = '#000', scale = .5) {
  const t = tex((g, w, h) => { g.fillStyle = bg; g.beginPath(); g.roundRect ? g.roundRect(4, 20, w - 8, h - 40, 30) : g.rect(4,20,w-8,h-40); g.fill();

    g.fillText(text, w / 2, h / 2); }, 512, 160);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false }));
  s.scale.set(scale * 3.2, scale, 1); s.renderOrder = 10; return s;
}

// Particle system: fire / smoke / spray share one implementation.
function particles(n, size, blending, colorFn) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({ size, map: glow, vertexColors: true, transparent: true, depthWrite: false, blending, sizeAttenuation: true });
  const pts = new THREE.Points(geo, mat);
  pts.userData = { life: new Float32Array(n).map(() => Math.random()), vel: new Float32Array(n * 3), n, colorFn };
  return pts;
}

{ const rock = new THREE.MeshStandardMaterial({ color: 0x4a3b30, roughness: 1, side: THREE.BackSide });

  }
}

// ---------------------------------------------------------------- frame loop
state.aimGood = 0; state.aimTotal = 0;
const clock = new THREE.Clock();
function stepParticles(p, dt, spawn, update) {
  const { life, vel, n } = p.userData, pos = p.geometry.attributes.position.array, col = p.geometry.attributes.color.array;
  for (let i = 0; i < n; i++) {
    life[i] += dt * (0.6 + (i % 7) * .08);
    if (life[i] >= 1) { life[i] = 0; spawn(i, pos, vel); }
    update(i, life[i], pos, vel, col, dt);
  }
  p.geometry.attributes.position.needsUpdate = true; p.geometry.attributes.color.needsUpdate = true;
}
function tick() {
  const dt = Math.min(.05, clock.getDelta()), t = clock.elapsedTime;
  crouch += (crouchTarget - crouch) * .06;
  camera.position.set(eye.x, eye.y - crouch * .9, eye.z);
  camera.rotation.set(pitch, yaw, 0, 'YXZ');
  if (state.timing) document.getElementById('timerV').textContent = `${((now() - state.t0) / 1000).toFixed(1)}s`;

  if (fireG.parent) {
    const L = state.fireLevel;
    fireLight.position.copy(fireBase).add(new THREE.Vector3(0, .6, .3));
    fireLight.intensity = (2.2 + Math.sin(t * 23) * .4 + Math.sin(t * 7) * .3) * L;
    dangerRing.material.opacity = .5 + .5 * Math.sin(t * 5);
    stepParticles(fire, dt * 1.6, (i, pos, vel) => {
      pos[i*3] = fireBase.x + (Math.random() - .5) * .7 * Math.max(.3, L); pos[i*3+1] = fireBase.y - .1; pos[i*3+2] = fireBase.z + (Math.random() - .5) * .35;
      vel[i*3] = (Math.random() - .5) * .2; vel[i*3+1] = (.9 + Math.random() * .9) * L; vel[i*3+2] = 0;
    }, (i, l, pos, vel, col, d) => {
      pos[i*3] += vel[i*3] * d; pos[i*3+1] += vel[i*3+1] * d; pos[i*3] += (fireBase.x - pos[i*3]) * d * 1.5;
      const k = 1 - l; col[i*3] = k * L; col[i*3+1] = k * k * .75 * L; col[i*3+2] = k * k * k * .25 * L;
    });
    const smokeOn = state.mode === 'smoke' || state.mode === 'egress' || state.mode === 'done';
    state.smoke += ((smokeOn ? 1 : .15) - state.smoke) * .01;
    stepParticles(smoke, dt * .35, (i, pos, vel) => {
      pos[i*3] = fireBase.x + (Math.random() - .5) * .6; pos[i*3+1] = fireBase.y + .8; pos[i*3+2] = fireBase.z;
      vel[i*3] = (Math.random() - .5) * 1.4; vel[i*3+1] = .8 + Math.random() * .6; vel[i*3+2] = .4 + Math.random() * 1.6;
    }, (i, l, pos, vel, col, d) => {
      pos[i*3] += vel[i*3] * d; pos[i*3+1] = Math.min(3.2 - Math.random() * .6 * (1 - state.smoke), pos[i*3+1] + vel[i*3+1] * d); pos[i*3+2] += vel[i*3+2] * d;
      const a = Math.sin(l * Math.PI) * .35 * state.smoke; col[i*3] = col[i*3+1] = col[i*3+2] = a;
    });
    smoke.material.blending = THREE.NormalBlending; smoke.material.opacity = .9;

    // Spray: from the chosen cylinder toward where the pointer hits the fire zone.
    let spraying = false;
    if (state.mode === 'spray' && pointerDown) {
      ray.setFromCamera(pointerNDC, camera);
      const hit = ray.intersectObject(fireHit)[0];
      state.aimTotal++;
      if (hit) {
        spraying = true; state.sprayTarget = hit.point;
        const nearBase = hit.point.y < fireBase.y + .25; if (nearBase) state.aimGood++;
        state.coverage += dt * (nearBase ? .35 : .08);
        state.fireLevel = Math.max(.15, 1 - state.coverage * .85);
        const m = document.getElementById('cov'); if (m) m.style.width = Math.min(100, state.coverage * 100) + '%';
        if (state.coverage >= 1) sprayDone();
      }
    }
    const nozzle = new THREE.Vector3(); (state.chosen || rack).getWorldPosition(nozzle); nozzle.y += 1.05;
    stepParticles(spray, dt * 2.4, (i, pos, vel) => {
      pos[i*3] = nozzle.x; pos[i*3+1] = nozzle.y; pos[i*3+2] = nozzle.z;
      const tgt = state.sprayTarget || fireBase, dir = tgt.clone().sub(nozzle);
      vel[i*3] = dir.x * (1 + Math.random() * .3) + (Math.random() - .5) * .3; vel[i*3+1] = dir.y + (Math.random() - .5) * .3; vel[i*3+2] = dir.z + (Math.random() - .5) * .3;
    }, (i, l, pos, vel, col, d) => {
      pos[i*3] += vel[i*3] * d * 1.1; pos[i*3+1] += vel[i*3+1] * d * 1.1; pos[i*3+2] += vel[i*3+2] * d * 1.1;
      const a = spraying ? (1 - l) * .9 : 0; col[i*3] = a; col[i*3+1] = a; col[i*3+2] = a;
    });

    chevrons.forEach((c, i) => { const f = ((i / chevrons.length + t * .25) % 1); c.position.set(1.2 - f * 4.4, .02, 1.5 - f * .2); c.material.opacity = Math.sin(f * Math.PI); });
    exitSign.material.opacity = .6 + .4 * Math.sin(t * 6);
    rack.children.forEach(g => { if (g.children[3]) g.children[3].visible = rack.visible; });
  }

  if (gasG.parent) {
    [ch4Layer, co2Layer].forEach(layer => layer.children.forEach((m, i) => { m.position.x = Math.sin(t * .4 + m.userData.phase) * .6; m.material.opacity = .1 + .08 * Math.sin(t * .8 + i); }));
    if (state.mode === 'sample' && pointerDown) state.detY = Math.max(.05, Math.min(3.1, 1.6 + pointerNDC.y * 1.7));
    const p = new THREE.Vector3(0, state.detY, 1.2);
    probe.position.copy(p); probeRing.position.copy(p); probeRing.rotation.x = t * 2;
    const ch4 = ch4At(state.detY), co2 = co2At(state.detY);
    const alarm = ch4 > 1.25;
    document.getElementById('detV').textContent = `${ch4.toFixed(2)} %`;
    document.getElementById('detV').style.color = alarm ? (Math.sin(t * 12) > 0 ? '#ff5252' : '#fff') : '#69f0ae';
    document.getElementById('detH').textContent = `height ${state.detY.toFixed(2)} m · CO₂ ${co2.toFixed(2)} %${alarm ? ' · ALARM, limit 1.25 %' : ''}`;
    probe.material.color.set(alarm ? 0xff1744 : co2 > 1 ? 0x40c4ff : 0x00e676);
    if (state.mode === 'sample') {
      if (state.detY > 2.6) state.sampled.add('roof');
      if (state.detY < .35) state.sampled.add('floor');
      const h = document.getElementById('sampHint');
      if (h) h.innerHTML = `${icon(state.sampled.has('roof') ? 'check_box' : 'check_box_outline_blank', 'ico')} roof · ${icon(state.sampled.has('floor') ? 'check_box' : 'check_box_outline_blank', 'ico')} floor`;
      if (state.sampled.size === 2) samplesDone();
    }
    sumpRing.material.opacity = .5 + .5 * Math.sin(t * 5);
    sumpRing.material.transparent = true;
  }

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

// ---------------------------------------------------------------- start
document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => {
  LANG = b.dataset.l; document.querySelectorAll('[data-l]').forEach(x => x.classList.toggle('on', x === b));
  document.getElementById('sub').textContent = tr(T('AR safety drill — hazards appear in your real surroundings through the camera.', 'AR सुरक्षा अभ्यास — खतरे कैमरे के ज़रिए आपके असली परिवेश में दिखते हैं।'));
  document.getElementById('mFire').textContent = tr(T('Fire & Explosion', 'आग और विस्फोट'));
  document.getElementById('mGas').textContent = tr(T('Gas Leak & Confined Space', 'गैस रिसाव और संवृत स्थान'));
});
document.querySelectorAll('[data-m]').forEach(b => b.onclick = async () => {
  document.getElementById('start').style.display = 'none';
  await startCamera();
  if (b.dataset.m === 'fire') fireFlow(); else gasFlow();
});
tick();
</script>
</body>
</html>
